# Amazon Associate Configuration
amazon:
  associate_id: "YOUR_AMAZON_ASSOCIATE_ID"  # Replace with your actual Amazon Associate ID
  tracking_id: "YOUR_TRACKING_ID-20"  # e.g., yoursite-20
  api_region: "US"  # US, UK, CA, etc.

# Content Generation Settings
content:
  categories:
    - "Tech Gadgets"
    - "Home & Kitchen"
    - "Books"
    - "Electronics"
    - "Sports & Outdoors"
  
  # Number of products to feature per post
  products_per_post: 5
  
  # Content generation frequency (in hours)
  generation_interval: 24
  
  # Output settings
  output_directory: "generated_content"
  format: "markdown"  # markdown, html, or json

# AI Content Generation (using free APIs or local generation)
ai:
  enabled: true
  temperature: 0.7
  max_tokens: 1000

# Publishing Settings
publishing:
  auto_publish: false  # Set to true for automatic publishing
  platforms:
    # WordPress Integration
    - type: "wordpress"
      enabled: false
      site_url: "https://yoursite.com"  # Your WordPress site URL
      username: ""  # Leave empty to use .env
      app_password: ""  # Leave empty to use .env
      status: "draft"  # Options: draft, publish, private
    
    # Medium Integration
    - type: "medium"
      enabled: false
      integration_token: ""  # Leave empty to use .env
      publish_status: "draft"  # Options: draft, public, unlisted
    
    # Ghost CMS Integration
    - type: "ghost"
      enabled: false
      api_url: "https://yoursite.com"  # Your Ghost site URL
      admin_api_key: ""  # Leave empty to use .env (format: id:secret)
      status: "draft"  # Options: draft, published
    
    # Generic Webhook (for custom integrations)
    - type: "webhook"
      enabled: false
      webhook_url: ""  # Leave empty to use .env
      method: "POST"  # POST or PUT
      headers:
        Content-Type: "application/json"

# Scheduling
schedule:
  enabled: true
  time: "09:00"  # Daily at 9 AM
  timezone: "UTC"
