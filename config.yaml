# Amazon Associate Configuration
amazon:
  associate_id: "YOUR_AMAZON_ASSOCIATE_ID"  # Replace with your actual Amazon Associate ID
  tracking_id: "YOUR_TRACKING_ID-20"  # e.g., yoursite-20
  api_region: "US"  # US, UK, CA, etc.

# Content Generation Settings
content:
  categories:
    - "Tech Gadgets"
    - "Home & Kitchen"
    - "Books"
    - "Electronics"
    - "Sports & Outdoors"
  
  # Number of products to feature per post
  products_per_post: 6
  
  # Content generation frequency (in hours)
  generation_interval: 6
  
  # Output settings
  output_directory: "generated_content"
  format: "markdown"  # markdown, html, or json

# AI Content Generation (using free APIs or local generation)
ai:
  enabled: true
  temperature: 0.7
  max_tokens: 1000

# Publishing Settings
publishing:
  auto_publish: true  # Set to true for automatic publishing
  platforms:
    # YouTube Integration
    - type: "youtube"
      enabled: true
      channel_id: ""  # Leave empty to use .env
      credentials_file: ""  # Leave empty to use .env (path to OAuth credentials JSON)
      api_key: ""  # Leave empty to use .env (optional)
      post_type: "community"  # community posts (text-based)

# Scheduling
schedule:
  enabled: true
  time: "09:00"  # Daily at 9 AM
  timezone: "CST"
