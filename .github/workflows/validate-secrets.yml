name: Validate Secrets

on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-secrets:
    name: Validate Required Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check required secrets
      id: check_secrets
      run: |
        echo "## 🔐 Secrets Validation Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Initialize counters
        missing_count=0
        present_count=0
        
        # Check AMAZON_ASSOCIATE_ID
        if [ -z "${{ secrets.AMAZON_ASSOCIATE_ID }}" ]; then
          echo "❌ AMAZON_ASSOCIATE_ID is missing" >> $GITHUB_STEP_SUMMARY
          echo "missing_amazon_associate=true" >> $GITHUB_OUTPUT
          ((missing_count++))
        else
          echo "✅ AMAZON_ASSOCIATE_ID is configured" >> $GITHUB_STEP_SUMMARY
          ((present_count++))
        fi
        
        # Check AMAZON_TRACKING_ID
        if [ -z "${{ secrets.AMAZON_TRACKING_ID }}" ]; then
          echo "❌ AMAZON_TRACKING_ID is missing" >> $GITHUB_STEP_SUMMARY
          echo "missing_amazon_tracking=true" >> $GITHUB_OUTPUT
          ((missing_count++))
        else
          echo "✅ AMAZON_TRACKING_ID is configured" >> $GITHUB_STEP_SUMMARY
          ((present_count++))
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Optional Secrets (for YouTube publishing):" >> $GITHUB_STEP_SUMMARY
        
        # Check optional secrets
        if [ -z "${{ secrets.YOUTUBE_CHANNEL_ID }}" ]; then
          echo "⚪ YOUTUBE_CHANNEL_ID is not configured (optional)" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ YOUTUBE_CHANNEL_ID is configured" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -z "${{ secrets.YOUTUBE_CREDENTIALS_FILE }}" ]; then
          echo "⚪ YOUTUBE_CREDENTIALS_FILE is not configured (optional)" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ YOUTUBE_CREDENTIALS_FILE is configured" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -z "${{ secrets.YOUTUBE_API_KEY }}" ]; then
          echo "⚪ YOUTUBE_API_KEY is not configured (optional)" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ YOUTUBE_API_KEY is configured" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Save counts
        echo "missing_count=$missing_count" >> $GITHUB_OUTPUT
        echo "present_count=$present_count" >> $GITHUB_OUTPUT
        
        if [ $missing_count -gt 0 ]; then
          echo "status=missing" >> $GITHUB_OUTPUT
          echo "### ⚠️ Action Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$missing_count required secret(s) are missing. The system will not work properly without them." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To configure secrets, choose one of these methods:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Method 1: Automated Setup Script (Recommended)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo './scripts/setup-secrets.sh' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Method 2: Manual Setup via GitHub UI" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to **Settings** → **Secrets and variables** → **Actions**" >> $GITHUB_STEP_SUMMARY
          echo "2. Click **New repository secret**" >> $GITHUB_STEP_SUMMARY
          echo "3. Add the missing secrets listed above" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Method 3: Use GitHub CLI" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'gh secret set AMAZON_ASSOCIATE_ID --body "yourname-20"' >> $GITHUB_STEP_SUMMARY
          echo 'gh secret set AMAZON_TRACKING_ID --body "yourname-20"' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📖 For detailed instructions, see [AUTOMATION.md](https://github.com/${{ github.repository }}/blob/main/AUTOMATION.md)" >> $GITHUB_STEP_SUMMARY
        else
          echo "status=complete" >> $GITHUB_OUTPUT
          echo "### ✅ All Required Secrets Configured!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your repository is properly configured for automated content generation." >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Set validation status
      if: steps.check_secrets.outputs.status == 'missing'
      run: |
        echo "::warning::Required secrets are missing. Please configure them to enable automation."
        # Don't fail the workflow, just warn
        exit 0
